name: Package and Release

on:
  push:
    tags:
      - 'v*' # Запускать только когда мы создаем тег, начинающийся на 'v' (например, v1.0.0)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Важно для пакировщика

      - name: Package and Upload to CurseForge
        uses: BigWigsMods/packager@master
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }} # Этот токен GitHub дает автоматически